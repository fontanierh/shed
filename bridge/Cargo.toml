[package]
name = "shed-bridge"
version = "0.1.0"
edition = "2021"
description = "Serves Pi, Prime Agent and DeepSeek Harness sessions to the Shed apps over one WebSocket protocol"
license = "MIT"
repository = "https://github.com/fontanierh/shed"
publish = false

[[bin]]
name = "agent-remote"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
strum = { version = "0.27", features = ["derive"] }
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
