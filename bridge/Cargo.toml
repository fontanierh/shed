[package]
name = "shed-bridge"
version = "0.1.0"
edition = "2021"
description = "Serves Pi and Prime Agent sessions to the Shed apps over one WebSocket protocol"
license = "MIT"
repository = "https://github.com/fontanierh/shed"
publish = false

[[bin]]
name = "agent-remote"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
