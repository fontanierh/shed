name: Shed
options:
  bundleIdPrefix: dev.agentremote
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  Shed:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # Bundle IDs are unique per Apple developer account: override with SHED_BUNDLE_ID=com.example.shed.
    SHED_BUNDLE_ID: dev.agentremote.shed
targets:
  Shed:
    type: application
    platform: iOS
    sources:
      - Shed
      - path: ../Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: Shed
        product: ShedKit
      - target: ShedLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHED_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. Set on each target: XcodeGen's own target default (iPhone and iPad) wins over the project's.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Shed/Info.plist
      properties:
        CFBundleDisplayName: Shed
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # 120 Hz on ProMotion phones: without it Core Animation holds the app's animations to 60.
        CADisableMinimumFrameDurationOnPhone: true
        NSSupportsLiveActivities: true
        UIAppFonts:
          - Fonts/NordwandMono-Regular.otf
          - Fonts/NordwandMono-Medium.otf
          - Fonts/NordwandMono-SemiBold.otf
          - Fonts/NordwandMono-Bold.otf
          - Fonts/NordwandMono-Italic.otf
        CFBundleURLTypes:
          - CFBundleURLName: dev.agentremote.shed
            CFBundleURLSchemes: [shed]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Shed uses the camera to attach photos and videos to a message.
        NSLocalNetworkUsageDescription: Shed connects to the bridge on your Mac.
        NSMicrophoneUsageDescription: Shed uses the microphone when recording a video to attach.
  ShedLive:
    type: app-extension
    platform: iOS
    sources:
      - ShedLive
    dependencies:
      - package: Shed
        product: ShedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHED_BUNDLE_ID).live
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: ShedLive/Info.plist
      properties:
        CFBundleDisplayName: Shed
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
