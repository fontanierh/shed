name: Shed
options:
  bundleIdPrefix: dev.agentremote
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  AgentRemote:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Henry's Personal Team. Free provisioning: installs expire after 7 days, then rebuild.
    DEVELOPMENT_TEAM: XQ8P3CLCKV
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Shed:
    type: application
    platform: iOS
    sources:
      - Shed
      - path: ../Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: AgentRemote
        product: AgentRemoteKit
      - target: ShedLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentremote.shed
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Shed
    info:
      path: Shed/Info.plist
      properties:
        CFBundleDisplayName: Shed
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        UIAppFonts:
          - Fonts/NordwandMono-Regular.otf
          - Fonts/NordwandMono-Medium.otf
          - Fonts/NordwandMono-SemiBold.otf
          - Fonts/NordwandMono-Bold.otf
          - Fonts/NordwandMono-Italic.otf
        CFBundleURLTypes:
          - CFBundleURLName: dev.agentremote.shed
            CFBundleURLSchemes: [shed]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Shed connects to the bridge on your Mac.
  ShedLive:
    type: app-extension
    platform: iOS
    sources:
      - ShedLive
    dependencies:
      - package: AgentRemote
        product: AgentRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentremote.shed.live
    info:
      path: ShedLive/Info.plist
      properties:
        CFBundleDisplayName: Shed
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
