name: apps

on:
  pull_request:
    paths: ["apps/**", "protocol/**", ".github/workflows/apps.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "protocol/**", ".github/workflows/apps.yml"]

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/Package.resolved') }}
      - run: swift --version
      - run: swift test
        working-directory: apps

  # The phone app and its Live Activity extension: `swift test` builds the package for the Mac only, so code under
  # `#if os(iOS)` and the Xcode project itself are compiled nowhere else. Unsigned, for the simulator.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      # The Xcode project and its plists are made from project.yml and committed: they must be what it makes. XcodeGen
      # is pinned, since another version may write the same project differently.
      - name: The Xcode project is what project.yml makes
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          (cd apps/iOS && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet)
          git diff --exit-code -- apps/iOS
      - run: >
          xcodebuild -project apps/iOS/Shed.xcodeproj -scheme Shed
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/derived"
          CODE_SIGNING_ALLOWED=NO build
