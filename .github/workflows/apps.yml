name: apps

on:
  pull_request:
    paths: ["apps/**", ".github/workflows/apps.yml"]
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/apps.yml"]

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/Package.resolved') }}
      - run: swift --version
      - run: swift test
        working-directory: apps
