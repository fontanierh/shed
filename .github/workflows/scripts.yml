name: scripts

# The parts of Shed that are neither Rust nor Swift: the installer and what it installs, the DeepSeek Harness
# plugins, Pi's extensions, the web module for Prime. Nothing here runs them. It checks that each file still parses,
# and that the shell scripts have no error shellcheck is sure of. Pi's extensions are checked for syntax only, not
# for types: the packages they import are Pi's.
on:
  pull_request:
    paths: ["**.sh", "**.mjs", "**.py", "**.ts", "setup/**", ".github/scripts/**", ".github/workflows/scripts.yml"]
  push:
    branches: [main]
    paths: ["**.sh", "**.mjs", "**.py", "**.ts", "setup/**", ".github/scripts/**", ".github/workflows/scripts.yml"]

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Before anything that runs node: the runner's own may be older than the one the files are written for.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Shell scripts parse
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - name: Shell scripts have no certain error
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error
      - name: JavaScript modules parse
        run: git ls-files -z '*.mjs' | xargs -0 -n1 node --check
      - name: Python files parse
        run: git ls-files -z '*.py' | xargs -0 python3 -m py_compile
      - name: TypeScript files parse
        run: git ls-files -z '*.ts' | xargs -0 node --no-warnings .github/scripts/ts-syntax.mjs
      - name: The installer's JSON files parse
        run: git ls-files -z 'setup/*.json' 'setup/**/*.json' | xargs -0 -n1 python3 -m json.tool >/dev/null
      - name: The Open Codex patches are patches
        run: git ls-files -z '*.patch' | xargs -0 -n1 git apply --numstat

  # The scripts run on macOS, whose /bin/bash is 3.2: what parses under the runner's bash 5 may not there (`|&`, `;&`).
  # Syntax only: a bash 4 builtin or option (`local -A`, `mapfile`) parses, and fails only when run.
  macos-bash:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /bin/bash --version
      - name: Shell scripts parse under macOS's own bash
        run: git ls-files -z '*.sh' | xargs -0 -n1 /bin/bash -n
